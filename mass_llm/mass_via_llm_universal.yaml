blueprint:
  domain: automation
  name: Music Assistant - Universal Voice Control (All-in-One)
  description: >
    Unified Voice Control for Music Assistant.
    - Supports English and German commands.
    - Select ANY conversation agent (Extended OpenAI, Ollama, etc.).
    - Supports Play, Stop, Shuffle, Repeat, and Volume.
  source_url: https://github.com/music-assistant/voice-support
  homeassistant:
    min_version: 2024.10.0

input:
  llm_agent:
    name: Conversation Agent
    description: Select the Conversation Agent (e.g. Extended OpenAI, Ollama).
    selector:
      entity:
        filter:
          - domain: conversation
        multiple: false

  default_player:
    name: Default Player
    description: Fallback player if none is mentioned.
    selector:
      entity:
        filter:
          - integration: music_assistant
            domain: media_player
        multiple: false
    default:

  play_continuously:
    name: Radio Mode
    description: 'Set to "Always" for continuous playback (Queue/Radio).'
    selector:
      select:
        options:
          - Use player settings
          - Always
          - Never
    default: Use player settings

  trigger:
    name: Trigger Sentences
    description: Sentences that trigger this automation.
    selector:
      text:
        multiline: false
        multiple: true
    default:
      - (shuffle|play|listen to|spiele|hör|höre) {query}
      - (stop|pause|resume|next|skip|previous|stopp|halt|pausier|pausiere|fortsetzen|nächstes|überspringen|vorheriges) [the|die] [music|song|track|media|musik|lied|titel|medium] [in|on|im|auf] {query}
      - (stop|pause|resume|next|skip|previous|stopp|halt|pausier|pausiere|fortsetzen|nächstes|überspringen|vorheriges) [the|die] [music|song|track|media|musik|lied|titel|medium]
      - (turn on|turn off|enable|disable|set|aktiviere|deaktiviere|schalte ein|schalte aus|setze) (shuffle|zufallswiedergabe|repeat|wiederholen) [in|on|im|auf] {query}
      - (turn on|turn off|enable|disable|set|aktiviere|deaktiviere|schalte ein|schalte aus|setze) (shuffle|zufallswiedergabe|repeat|wiederholen)
      - repeat (one|all|off|eins|alle|aus)
      - wiederhole (eins|alle|aus)
      - (set|change) volume [to] {query}
      - (turn|volume) (up|down) [in|on] {query}
      - (turn|volume) (up|down)
      - (setze|ändere) (lautstärke|volume) [auf] {query}
      - (mach|stelle) (lauter|leiser) [in|im|auf] {query}
      - (mach|stelle) (lauter|leiser)

  combine_text:
    name: Combine Word
    description: Word used to join names in responses (e.g., "and" or "und").
    selector:
      text: {}
    default: and

  no_target_response:
    name: No Target Response
    selector:
      text: {}
    default: No target could be determined and no default player is set

  area_response:
    name: Area Response
    selector:
      text: {}
    default: OK, <media_info> in <area_info>

  player_response:
    name: Player Response
    selector:
      text: {}
    default: OK, <media_info> on <player_info>

  area_and_player_response:
    name: Area+Player Response
    selector:
      text: {}
    default: OK, <media_info> in <area_info> and on <player_info>

  expose_players:
    name: Expose Players to LLM
    selector:
      boolean: {}
    default: true

  expose_areas:
    name: Expose Areas to LLM
    selector:
      boolean: {}
    default: true

  llm_prompt_intro:
    name: Prompt Intro
    selector:
      text:
        multiline: true
    default: >-
      You are an AI that transforms voice commands into JSON.
      The user may speak in any language.
      Query: "{{ trigger.sentence }}"
      Expected JSON:
      {"action_data":{"media_id":"name","media_type":"type","artist":"name","album":"name"},
      "media_description":"description","target_data":{"areas":["name"],"players":["name"]}}

  llm_prompt_media_type:
    name: Prompt Media Type
    selector:
      text:
        multiline: true
    default: >-
      "media_type" is mandatory (English only):
      - "control" (STOP, NEXT, SHUFFLE, REPEAT, VOLUME)
      - "track", "album", "artist", "playlist", "radio"

  llm_prompt_media_id:
    name: Prompt Media ID
    selector:
      text:
        multiline: true
    default: >-
      "media_id" is mandatory.
      If "control": media_stop, media_play_pause, media_next_track, media_previous_track, shuffle_on, shuffle_off, repeat_all, repeat_one, repeat_off, volume_up, volume_down, volume_X (0-100).
      If music: The name of the media.
      Special: "Play music" -> media_type:"artist", media_id:"Library".

  llm_prompt_artist_album:
    name: Prompt Artist/Album
    selector:
      text:
        multiline: true
    default: Optional fields to restrict search.

  llm_prompt_examples:
    name: Prompt Examples
    selector:
      text:
        multiline: true
    default: >-
      Stop -> {"action_data":{"media_id":"media_stop","media_type":"control"}}
      Volume 50 -> {"action_data":{"media_id":"volume_50","media_type":"control"}}
      Play Queen -> {"action_data":{"media_id":"Queen","media_type":"artist"}}

  llm_prompt_media_description:
    name: Prompt Description
    selector:
      text:
        multiline: true
    default: Describe the action (e.g., "Stopping music", "Playing Queen").

  llm_prompt_target:
    name: Prompt Target
    selector:
      text:
        multiline: true
    default: >-
      Identify where to play.
      {% if expose_areas %}
      Areas: {{ area_names }}. Return list in "target_data.areas".
      {% endif %}
      {% if expose_players %}
      Players: {{ player_names }}. Return list in "target_data.players".
      {% endif %}

  llm_prompt_outro:
    name: Prompt Outro
    selector:
      text:
        multiline: true
    default: Respond ONLY with valid JSON.

triggers:
  - alias: Trigger for music request
    trigger: conversation
    command: !input trigger

actions:
  - alias: Setup Variables
    variables:
      version: 20250404
      shuffle: "{{ ('shuffle' in trigger.sentence|lower) or ('zufall' in trigger.sentence|lower) }}"
      expose_areas: !input expose_areas
      expose_players: !input expose_players
      prompt:
        intro: !input llm_prompt_intro
        media_type: !input llm_prompt_media_type
        media_id: !input llm_prompt_media_id
        artist_album: !input llm_prompt_artist_album
        examples: !input llm_prompt_examples
        description: !input llm_prompt_media_description
        target: !input llm_prompt_target
        outro: !input llm_prompt_outro
      area_names: "{{ integration_entities('music_assistant') | map('area_name') | list }}"
      player_names: "{{ integration_entities('music_assistant') | map('state_attr','friendly_name') | list }}"

  - alias: Process with LLM
    action: conversation.process
    data:
      text: "{{ prompt.values() | join('\n') }}"
      agent_id: !input llm_agent
    response_variable: result

  - alias: Parse Result
    variables:
      llm_result: "{{ result.response.speech.plain.speech | from_json }}"
      play_continuously: !input play_continuously
      llm_action_data:
        media_id: "{{ llm_result.action_data.media_id }}"
        media_type: "{{ llm_result.action_data.media_type }}"
        artist: "{{ llm_result.action_data.artist | default('NA', true) }}"
        album: "{{ llm_result.action_data.album | default('NA', true) }}"
        radio_mode: >-
          {{
            false if play_continuously == 'Never'
            else play_continuously == 'Always' and llm_result.action_data.media_type != 'radio'
            or 'NA'
          }}
      llm_target_data:
        entity_id: >-
          {% set players = llm_result.get('target_data', {}).get('players', []) %}
          {% set players = players | join('|') if players is list else players %}
          {{
            integration_entities('music_assistant') | expand
            | selectattr('name', 'in', player_names | select('search', players, ignorecase=true) | list)
            | map(attribute='entity_id') | list if players else []
          }}
        area_id: >-
          {% set areas = llm_result.get('target_data', {}).get('areas', []) %}
          {% set areas = areas | join('|') if areas is list else areas %}
          {{
            area_names | select('search', areas, ignorecase=true)
            | map('area_id') | list if areas else []
          }}
      llm_target: "{{ iif(llm_result.get('target_data', {}).get('players') or llm_result.get('target_data', {}).get('areas')) }}"
      device_area: "{{ area_id(trigger.device_id) if area_name(trigger.device_id) in area_names }}"
      default_player: !input default_player
      backup_target: "{{ (dict(area_id=[device_area]) if device_area) or (dict(entity_id=[default_player]) if default_player) }}"
      target_data: "{{ (llm_target_data if llm_target else backup_target) | default({}, true) }}"
      target: "{{ dict(target_data.items() | selectattr('1')) }}"

  - alias: Execute Action
    if:
      - condition: template
        value_template: "{{ iif(target) }}"
    then:
      - choose:
          # Shuffle
          - conditions:
              - condition: template
                value_template: "{{ llm_action_data.media_id in ['shuffle_on', 'shuffle_off'] }}"
            sequence:
              - service: media_player.shuffle_set
                data:
                  shuffle: "{{ true if llm_action_data.media_id == 'shuffle_on' else false }}"
                target: "{{ target }}"

          # Repeat
          - conditions:
              - condition: template
                value_template: "{{ 'repeat' in llm_action_data.media_id }}"
            sequence:
              - service: media_player.repeat_set
                data:
                  repeat: "{{ llm_action_data.media_id | replace('repeat_', '') }}"
                target: "{{ target }}"

          # Volume
          - conditions:
              - condition: template
                value_template: "{{ 'volume' in llm_action_data.media_id }}"
            sequence:
              - choose:
                  - conditions: >-
                      {{ '_' in llm_action_data.media_id and (llm_action_data.media_id.split('_')[1] | is_number) }}
                    sequence:
                      - service: media_player.volume_set
                        data:
                          volume_level: "{{ (llm_action_data.media_id.split('_')[1] | float) / 100 }}"
                        target: "{{ target }}"
                  - conditions: "{{ llm_action_data.media_id == 'volume_up' }}"
                    sequence:
                      - service: media_player.volume_up
                        target: "{{ target }}"
                  - conditions: "{{ llm_action_data.media_id == 'volume_down' }}"
                    sequence:
                      - service: media_player.volume_down
                        target: "{{ target }}"

          # Basic Control
          - conditions:
              - condition: template
                value_template: "{{ llm_action_data.media_type == 'control' }}"
            sequence:
              - service: >-
                  media_player.{{
                    {
                      'stop': 'media_stop',
                      'pause': 'media_pause',
                      'play': 'media_play',
                      'next': 'media_next_track',
                      'skip': 'media_next_track',
                      'previous': 'media_previous_track'
                    }.get(llm_action_data.media_id, llm_action_data.media_id)
                  }}
                target: "{{ target }}"

        default:
          # Play Media
          - action: music_assistant.play_media
            data: "{{ dict(llm_action_data.items() | rejectattr('1', 'eq', 'NA')) }}"
            target: "{{ target }}"
          - if:
              - condition: template
                value_template: "{{ shuffle == true }}"
            then:
              - action: media_player.shuffle_set
                data:
                  shuffle: true
                target: "{{ target }}"

  - alias: Send Response
    variables:
      combine: !input combine_text
      responses:
        no_target: !input no_target_response
        only_area: !input area_response
        only_player: !input player_response
        area_player: !input area_and_player_response
      response: >-
        {% if iif(target.get('area_id') and target.get('entity_id')) %}
          area_player
        {% elif iif(target.get('area_id')) %}
          only_area
        {% elif iif(target.get('entity_id')) %}
          only_player
        {% else %}
          no_target
        {% endif %}
      area_list: "{{ target.get('area_id', []) | map('area_name') | list }}"
      area_info: >-
        {{ area_list[:-1] | join(', ') ~ ' ' ~ combine ~ ' ' ~ area_list[-1]
           if area_list | count > 2
           else area_list | join(' ' ~ combine ~ ' ') }}
      player_list: "{{ target.get('entity_id') | map('state_attr', 'friendly_name') | list }}"
      player_info: >-
        {{ player_list[:-1] | join(', ') ~ ' ' ~ combine ~ ' ' ~ player_list[-1]
           if player_list | count > 2
           else player_list | join(' ' ~ combine ~ ' ') }}
      media_info: "{{ llm_result.media_description | default(llm_action_data.media_id, true) }}"

    set_conversation_response: >-
      {{ responses[response]
         | replace('<media_info>', media_info)
         | replace('<area_info>', area_info)
         | replace('<player_info>', player_info)
      }}
mode: parallel
