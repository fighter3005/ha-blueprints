blueprint:
  domain: automation
  name: Music Assistant - Universal LLM Enhanced Voice Support (EN+DE, Volume, Agent Select)
  source_url: https://github.com/music-assistant/voice-support
  description: >-
    Play & control Music Assistant using voice commands with LLM assistance.

    - Universal: Works with any HA conversation agent entity (Extended OpenAI Conversation, Ollama, etc.)
    - EN + DE triggers included
    - Supports: Play, Stop/Pause/Resume/Next/Previous, Shuffle, Repeat, Volume, Generic "Play music"
    - Area/player targeting + fallback to device area or default player
  homeassistant:
    min_version: 2024.10.0

input:
  llm_agent:
    name: LLM conversation agent
    description: Select the Home Assistant conversation agent entity to process the query.
    selector:
      entity:
        filter:
          - domain:
              - conversation
        multiple: false

  music_assistant_settings:
    name: Settings for Music Assistant playback
    icon: mdi:music
    input:
      default_player:
        name: Default Player
        description: The default Music Assistant player used if no target can be determined.
        selector:
          entity:
            filter:
              - integration: music_assistant
                domain:
                  - media_player
            multiple: false
        default:

      play_continuously:
        name: Radio Mode
        description: >-
          IMPORTANT: Set this to "Always" if you want the queue to auto-fill with songs (Continuous/Radio mode).
          If set to "Never", playback stops after the requested media finishes.
        selector:
          select:
            options:
              - Use player settings
              - Always
              - Never
            multiple: false
            custom_value: false
            sort: false
        default: Use player settings

  response_settings:
    name: Trigger and response settings for Assist
    icon: mdi:chat
    collapsed: true
    input:
      trigger:
        name: Conversation trigger sentences (EN + DE)
        description: Triggers for the automation.
        selector:
          text:
            multiline: false
            multiple: true
        default:
          # PLAY (EN/DE)
          - (shuffle|play|listen to|spiele|hör|höre) {query}

          # BASIC CONTROLS (EN/DE)
          - (stop|pause|resume|next|skip|previous|stopp|halt|pausier|pausiere|fortsetzen|nächstes|überspringen|vorheriges) [the|die] [music|song|track|media|musik|lied|titel|medium] [in|on|im|auf] {query}
          - (stop|pause|resume|next|skip|previous|stopp|halt|pausier|pausiere|fortsetzen|nächstes|überspringen|vorheriges) [the|die] [music|song|track|media|musik|lied|titel|medium]

          # SHUFFLE / REPEAT (EN/DE)
          - (turn on|turn off|enable|disable|set|aktiviere|deaktiviere|schalte ein|schalte aus|setze) (shuffle|zufallswiedergabe|repeat|wiederholen) [in|on|im|auf] {query}
          - (turn on|turn off|enable|disable|set|aktiviere|deaktiviere|schalte ein|schalte aus|setze) (shuffle|zufallswiedergabe|repeat|wiederholen)
          - repeat (one|all|off|eins|alle|aus)
          - wiederhole (eins|alle|aus)

          # VOLUME (EN/DE)
          - (set|change) volume [to] {query}
          - (turn|volume) (up|down) [in|on] {query}
          - (turn|volume) (up|down)
          - (setze|ändere) (lautstärke|volume) [auf] {query}
          - (mach|stelle) (lauter|leiser) [in|im|auf] {query}
          - (mach|stelle) (lauter|leiser)

      combine_text:
        name: Combine word
        description: Word used to join areas (e.g. "Kitchen <and> Living Room")
        selector:
          text:
            multiline: false
            multiple: false
        default: and

      no_target_response:
        name: No target response
        description: Response when no player/area is found.
        selector:
          text:
            multiline: false
            multiple: false
        default: No target could be determined and no default player is set

      area_response:
        name: Area response
        selector:
          text:
            multiline: false
            multiple: false
        default: OK, <media_info> in <area_info>

      player_response:
        name: Player response
        selector:
          text:
            multiline: false
            multiple: false
        default: OK, <media_info> on <player_info>

      area_and_player_response:
        name: Area and Player response
        selector:
          text:
            multiline: false
            multiple: false
        default: OK, <media_info> in <area_info> and on <player_info>

  prompt_settings:
    name: Prompt setting for the LLM
    icon: mdi:robot
    description: Fine-tune the prompts.
    collapsed: true
    input:
      expose_players:
        name: Expose Music Assistant Players
        selector:
          boolean: {}
        default: true

      expose_areas:
        name: Expose areas with Music Assistant Players
        selector:
          boolean: {}
        default: true

      llm_prompt_intro:
        name: Introduction for LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          You are an AI process that transforms a voice command into a structured JSON.
          The user may ask to play music (search) OR control playback (stop, next, shuffle, repeat, volume).
          The user request may be in any language.

          This is the voice command query provided by the user: "{{ trigger.sentence }}"

          Here is the structured JSON that I expect in response:
          {"action_data":{"media_id":"name","media_type":"type","artist":"name","album":"name"},
           "media_description":"description of media/action",
           "target_data":{"areas":["area name"],"players":["player name"]}}

      llm_prompt_media_type:
        name: Media type LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          The argument "media_type" is mandatory!
          Values can be (MUST be English):
          - "control" if the user wants to STOP, PAUSE, RESUME, SKIP, SHUFFLE, REPEAT or ADJUST VOLUME.
          - "track" if the search is about a specific track.
          - "album" if the search is about an album.
          - "artist" if the search is about an artist.
          - "playlist" if the search requests a playlist.
          - "radio" in case the search is a radio channel.
          If unsure (e.g. genre request), use "track".

      llm_prompt_media_id:
        name: Media ID LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          The argument "media_id" is mandatory!
          IF media_type is "control":
          - For basic control use: "media_stop", "media_play_pause", "media_next_track", "media_previous_track".
          - For shuffle use: "shuffle_on" or "shuffle_off".
          - For repeat use: "repeat_all", "repeat_one", or "repeat_off".
          - For volume use: "volume_up", "volume_down", or "volume_X" where X is 0-100 (e.g. "volume_45").
          IF media_type is NOT "control":
          - media_id is the name of the requested media.
          - SPECIAL: If the user says "Play music/Spiele etwas" (generic), use media_type: "artist" and media_id: "Library".

      llm_prompt_artist_album:
        name: Artist and album LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          If needed, "artist" and "album" can be used to further restrict the search.
          They are optional and never used for a playlist or control.

      llm_prompt_examples:
        name: Examples action data LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          Examples:
          Stop music >> {"action_data":{"media_id":"media_stop","media_type":"control"}}.
          Turn on shuffle >> {"action_data":{"media_id":"shuffle_on","media_type":"control"}}.
          Repeat all >> {"action_data":{"media_id":"repeat_all","media_type":"control"}}.
          Set volume to 50% >> {"action_data":{"media_id":"volume_50","media_type":"control"}}.
          Turn it up >> {"action_data":{"media_id":"volume_up","media_type":"control"}}.
          Play something / Play Music >> {"action_data":{"media_id":"Library","media_type":"artist"}}.

      llm_prompt_media_description:
        name: Media description LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          "media_description" describes the requested media/action.
          For controls: "Stopping", "Skipping", "Setting volume", etc.
          For music: "the best Queen songs", etc.

      llm_prompt_target:
        name: Target data LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          The "target_data" key defines where to play/control.
          {% if expose_areas %}
          Areas with Music Assistant players: {{ area_names }}.
          Use ONLY these names for target_data.areas (always a list).
          {% endif %}
          If no area is mentioned or cannot be matched, use {"areas": []}.

          {% if expose_players %}
          Music Assistant players: {{ player_names }}.
          Use ONLY these names for target_data.players (always a list).
          {% endif %}
          If no player is mentioned or cannot be matched, use {"players": []}.

      llm_prompt_outro:
        name: Outro for LLM prompt
        selector:
          text:
            multiline: true
            multiple: false
        default: >-
          IMPORTANT:
          - The input query may be in any language.
          - "media_type" MUST be one of the English terms.
          - Reply with ONLY the JSON model. No extra text.

triggers:
  - alias: Trigger to request for music
    trigger: conversation
    command: !input trigger

actions:
  - alias: Store input from blueprint in variables so they can be used in the prompt
    variables:
      version: 20250404
      shuffle: "{{ 'shuffle' in trigger.sentence | lower }}"
      expose_areas: !input expose_areas
      expose_players: !input expose_players
      prompt:
        intro: !input llm_prompt_intro
        media_type: !input llm_prompt_media_type
        media_id: !input llm_prompt_media_id
        artist_album: !input llm_prompt_artist_album
        examples: !input llm_prompt_examples
        description: !input llm_prompt_media_description
        target: !input llm_prompt_target
        outro: !input llm_prompt_outro
      area_names: "{{ integration_entities('music_assistant') | map('area_name') | list }}"
      player_names: "{{ integration_entities('music_assistant') | map('state_attr','friendly_name') | list }}"

  - alias: Send the request to the LLM
    action: conversation.process
    data:
      text: "{{ prompt.values() | join('') }}"
      agent_id: !input llm_agent
    response_variable: result

  - alias: Store relevant part of LLM result in variable and define target
    variables:
      llm_result: "{{ result.response.speech.plain.speech | from_json }}"
      play_continuously: !input play_continuously
      llm_action_data:
        media_id: "{{ llm_result.action_data.media_id }}"
        media_type: "{{ llm_result.action_data.media_type }}"
        artist: "{{ llm_result.action_data.artist | default('NA', true) }}"
        album: "{{ llm_result.action_data.album | default('NA', true) }}"
        radio_mode: >-
          {{
            false if play_continuously == 'Never'
            else play_continuously == 'Always' and llm_result.action_data.media_type != 'radio'
            or 'NA'
          }}
      llm_target_data:
        entity_id: >-
          {% set players = llm_result.get('target_data', {}).get('players', []) %}
          {% set players = players | join('|') if players is list else players %}
          {{
            integration_entities('music_assistant') | expand
            | selectattr('name', 'in',
              player_names | select('search', players, ignorecase=true) | list
            )
            | map(attribute='entity_id') | list if players else []
          }}
        area_id: >-
          {% set areas = llm_result.get('target_data', {}).get('areas', []) %}
          {% set areas = areas | join('|') if areas is list else areas %}
          {{
            area_names | select('search', areas, ignorecase=true)
            | map('area_id') | list if areas else []
          }}
      llm_target: "{{ iif(llm_result.get('target_data', {}).get('players') or llm_result.get('target_data', {}).get('areas')) }}"
      device_area: "{{ area_id(trigger.device_id) if area_name(trigger.device_id) in area_names }}"
      default_player: !input default_player
      backup_target: "{{ (dict(area_id=[device_area]) if device_area) or (dict(entity_id=[default_player]) if default_player) }}"
      target_data: "{{ (llm_target_data if llm_target else backup_target) | default({}, true) }}"
      target: "{{ dict(target_data.items() | selectattr('1')) }}"

  - alias: Only try to act when target was determined
    if:
      - alias: Check if it was possible to determine a target
        condition: template
        value_template: "{{ iif(target) }}"
    then:
      - choose:
          # 1. SHUFFLE CONTROL
          - conditions:
              - condition: template
                value_template: "{{ llm_action_data.media_id in ['shuffle_on', 'shuffle_off'] }}"
            sequence:
              - service: media_player.shuffle_set
                data:
                  shuffle: "{{ true if llm_action_data.media_id == 'shuffle_on' else false }}"
                target: "{{ target }}"

          # 2. REPEAT CONTROL
          - conditions:
              - condition: template
                value_template: "{{ 'repeat' in llm_action_data.media_id }}"
            sequence:
              - service: media_player.repeat_set
                data:
                  repeat: "{{ llm_action_data.media_id | replace('repeat_', '') }}"
                target: "{{ target }}"

          # 3. VOLUME CONTROL
          - conditions:
              - condition: template
                value_template: "{{ 'volume' in llm_action_data.media_id }}"
            sequence:
              - choose:
                  # Set volume to X%
                  - conditions: >-
                      {{ '_' in llm_action_data.media_id
                         and (llm_action_data.media_id.split('_')[1] | is_number) }}
                    sequence:
                      - service: media_player.volume_set
                        data:
                          volume_level: "{{ (llm_action_data.media_id.split('_')[1] | float) / 100 }}"
                        target: "{{ target }}"
                  # Volume up
                  - conditions: "{{ llm_action_data.media_id == 'volume_up' }}"
                    sequence:
                      - service: media_player.volume_up
                        target: "{{ target }}"
                  # Volume down
                  - conditions: "{{ llm_action_data.media_id == 'volume_down' }}"
                    sequence:
                      - service: media_player.volume_down
                        target: "{{ target }}"

          # 4. BASIC CONTROL
          - conditions:
              - condition: template
                value_template: "{{ llm_action_data.media_type == 'control' }}"
            sequence:
              - service: >-
                  media_player.{{
                    {
                      'stop': 'media_stop',
                      'pause': 'media_pause',
                      'play': 'media_play',
                      'next': 'media_next_track',
                      'skip': 'media_next_track',
                      'previous': 'media_previous_track'
                    }.get(llm_action_data.media_id, llm_action_data.media_id)
                  }}
                target: "{{ target }}"

        default:
          - alias: Play Music based on LLM result
            action: music_assistant.play_media
            data: "{{ dict(llm_action_data.items() | rejectattr('1', 'eq', 'NA')) }}"
            target: "{{ target }}"

          - alias: Set Shuffle if user asked for it in the query
            if:
              - condition: template
                value_template: "{{ shuffle == true }}"
            then:
              - action: media_player.shuffle_set
                data:
                  shuffle: true
                target: "{{ target }}"

  - alias: Set variables for responses
    variables:
      combine: !input combine_text
      responses:
        no_target: !input no_target_response
        only_area: !input area_response
        only_player: !input player_response
        area_player: !input area_and_player_response
      response: >-
        {% if iif(target.get('area_id') and target.get('entity_id')) %}
          area_player
        {% elif iif(target.get('area_id')) %}
          only_area
        {% elif iif(target.get('entity_id')) %}
          only_player
        {% else %}
          no_target
        {% endif %}
      area_list: "{{ target.get('area_id', []) | map('area_name') | list }}"
      area_info: >-
        {{ area_list[:-1] | join(', ') ~ ' ' ~ combine ~ ' ' ~ area_list[-1]
           if area_list | count > 2
           else area_list | join(' ' ~ combine ~ ' ') }}
      player_list: "{{ target.get('entity_id') | map('state_attr', 'friendly_name') | list }}"
      player_info: >-
        {{ player_list[:-1] | join(', ') ~ ' ' ~ combine ~ ' ' ~ player_list[-1]
           if player_list | count > 2
           else player_list | join(' ' ~ combine ~ ' ') }}
      media_info: "{{ llm_result.media_description | default(llm_action_data.media_id, true) }}"

  - alias: Set response for Assist
    set_conversation_response: >-
      {{ responses[response]
         | replace('<media_info>', media_info)
         | replace('<area_info>', area_info)
         | replace('<player_info>', player_info)
      }}

mode: parallel
